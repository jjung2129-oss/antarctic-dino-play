<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#a9dcff">
<title>펭귄 대탈출</title>
<script>
  // 카카오톡 인앱 브라우저에서 열면 기본 브라우저(사파리/크롬)로 자동으로 다시 열기 (한 번만 시도)
  (function () {
    var ua = navigator.userAgent || '';
    if (!/KAKAOTALK/i.test(ua)) return;
    try {
      if (sessionStorage.getItem('openedExternal')) return;
      sessionStorage.setItem('openedExternal', '1');
    } catch (e) {}
    location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>:root{--ink:#2b3a67;--pink:#ff8fab;--pinkD:#e2668a;--yellow:#ffd166;--yellowD:#e0a92e;--mint:#6fd6b5;--mintD:#3fae8c;--sky:#bfe6ff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}html,body{width:100%;height:var(--app-h,100%);overscroll-behavior:none;color:var(--ink);touch-action:none;-webkit-user-select:none;user-select:none;background:#a9dcff;font-family:Jua,Apple SD Gothic Neo,Malgun Gothic,sans-serif;position:fixed;top:0;left:0;overflow:hidden}canvas#c{display:block;position:fixed;top:0;left:0}button{cursor:pointer;color:var(--ink);border:none;font-family:inherit}.btn{background:var(--yellow);width:100%;box-shadow:0 6px 0 var(--yellowD);border-radius:20px;padding:14px 18px;font-size:22px;transition:transform 80ms,box-shadow 80ms;display:block}.btn:active{box-shadow:0 1px 0 var(--yellowD);transform:translateY(5px)}.btn.pink{background:var(--pink);color:#fff;box-shadow:0 6px 0 var(--pinkD)}.btn.pink:active{box-shadow:0 1px 0 var(--pinkD)}.btn.mint{background:var(--mint);color:#fff;box-shadow:0 6px 0 var(--mintD)}.btn.mint:active{box-shadow:0 1px 0 var(--mintD)}.btn.white{background:#fff;box-shadow:0 6px #c9dff0}.btn.white:active{box-shadow:0 1px #c9dff0}.btn.sm{border-radius:16px;padding:11px 12px;font-size:17px}.btn:disabled{opacity:.5}.row{gap:10px;width:100%;display:flex}.row>*{flex:1}.gap{height:14px}.gap.s{height:8px}.screen{height:var(--app-h,100%);z-index:10;padding:calc(16px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom));background:#a9dcff73;flex-direction:column;display:flex;position:fixed;top:0;left:0;right:0;overflow-y:auto}.screen.hidden{display:none}.card{text-align:center;background:#fff;border-radius:30px;width:min(360px,100%);margin:auto;padding:22px 20px;box-shadow:0 10px #2b3a671f,0 24px 40px #2b3a6726}.logo{color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);letter-spacing:1px;font-size:50px;line-height:1.05}.sub{color:var(--pinkD);margin-top:6px;font-size:17px}#hero{width:200px;height:170px;margin:4px auto 0;display:block}.best{margin-bottom:12px;font-size:18px}.best b{color:var(--pinkD);font-weight:400}.fishTotal{background:#eef8ff;border-radius:999px;margin-top:12px;padding:5px 14px;font-size:18px;display:inline-block}.tiny{justify-content:center;gap:12px;margin-top:12px;display:flex}.link{color:#7f8fb8;background:0 0;font-size:14px;text-decoration:underline}#hud{z-index:5;pointer-events:none;padding:calc(10px + env(safe-area-inset-top)) 12px 0;justify-content:space-between;align-items:flex-start;display:flex;position:fixed;top:0;left:0;right:0}#hud.hidden{display:none}.pill{text-align:center;background:#fff;border-radius:999px;min-width:74px;padding:7px 14px;font-size:20px;box-shadow:0 4px #2b3a671f}#scoreBox{text-align:center;margin-top:-4px}#score{color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);font-size:42px;line-height:1}#combo{color:var(--pinkD);text-shadow:0 2px #fff;height:22px;margin-top:4px;font-size:18px}#feverBar{background:#ffffffbf;border-radius:99px;width:120px;height:12px;margin:6px auto 0;position:relative;overflow:visible;box-shadow:0 2px #2b3a6726}#feverFill{background:linear-gradient(90deg,#ffb347,#ff6b8b);border-radius:99px;width:0%;height:100%;transition:width .15s}#feverBar span{font-size:16px;position:absolute;top:-6px;right:-20px}#feverBar.full #feverFill{background:linear-gradient(90deg,#ff6b8b,#ffd166,#6fd6b5,#5ec8f2,#b39cf0) 0 0/200% 100%;animation:.6s linear infinite rainbow}@keyframes rainbow{to{background-position:200% 0}}#banner{z-index:7;opacity:0;pointer-events:none;color:#fff;white-space:nowrap;text-shadow:0 2px #2b3a674d;background:linear-gradient(135deg,#5ec8f2,#8b5cf6);border-radius:22px;max-width:calc(100vw - 24px);padding:12px 22px;font-size:24px;position:fixed;top:32%;left:50%;transform:translate(-50%,-50%)scale(.6);box-shadow:0 8px #2b3a6726}#banner.on{animation:2.2s forwards bannerIn}@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-50%)scale(.6)}12%{opacity:1;transform:translate(-50%,-50%)scale(1.08)}20%,80%{opacity:1;transform:translate(-50%,-50%)scale(1)}to{opacity:0;transform:translate(-50%,-60%)scale(.95)}}.iconBtn{pointer-events:auto;background:#fff;border-radius:16px;width:46px;height:46px;font-size:20px;box-shadow:0 4px #2b3a6726}#powers{z-index:5;top:calc(62px + env(safe-area-inset-top));pointer-events:none;gap:6px;display:flex;position:fixed;left:12px}.pw{background:#fff;border-radius:14px;padding:4px 9px;font-size:16px;box-shadow:0 3px #2b3a671f}#tutorial{z-index:6;left:50%;top:calc(var(--app-h,100vh) - 150px - env(safe-area-inset-bottom));text-align:center;pointer-events:none;position:fixed;transform:translate(-50%)}#tutorial.hidden{display:none}#tutorial .hand{font-size:54px;animation:1s ease-in-out infinite tap}@keyframes tap{0%,to{transform:translateY(0)scale(1)}40%{transform:translateY(10px)scale(.9)}}#tutorial .msg{word-break:keep-all;background:#fff;border-radius:18px;width:max-content;max-width:calc(100vw - 32px);padding:10px 18px;font-size:18px;box-shadow:0 5px #2b3a671f}@keyframes swipe{0%,to{transform:translate(-50px)rotate(-10deg)}50%{transform:translate(50px)rotate(10deg)}}.overTitle{color:var(--pinkD);font-size:34px}.scoreBig{color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);margin:4px 0;font-size:64px;line-height:1.1}#newBest{background:var(--yellow);border-radius:999px;margin-bottom:6px;padding:4px 14px;font-size:16px;display:inline-block}.earn{margin:6px 0 14px;font-size:24px}.shopHead{justify-content:space-between;align-items:center;margin-bottom:12px;display:flex}.shopHead h2{font-size:30px;font-weight:400}.grid{grid-template-columns:1fr 1fr;gap:10px;display:grid}.skin{background:#f3faff;border:3px solid #0000;border-radius:20px;padding:8px 8px 10px}.skin.on{border-color:var(--mint);background:#eafff6}.skin canvas{aspect-ratio:1;width:100%;display:block}.skin .nm{margin:2px 0 6px;font-size:16px}.skin .btn{box-shadow:0 4px 0 var(--yellowD);border-radius:14px;padding:8px 6px;font-size:15px}.skin .btn.mint{box-shadow:0 4px 0 var(--mintD)}.skin .btn.white{box-shadow:0 4px #c9dff0}.dot{background:#ff4d6d;border-radius:50%;width:12px;height:12px;display:none;position:absolute;top:6px;right:10px;box-shadow:0 0 0 2px #fff}.dot.on{animation:1s infinite alternate pulse;display:block}@keyframes pulse{to{transform:scale(1.25)}}.mission{text-align:left;background:#f3faff;border-radius:18px;margin-bottom:10px;padding:12px 14px}.mtext{font-size:18px}.mbar{background:#dceaf6;border-radius:99px;height:10px;margin:8px 0;overflow:hidden}.mbar div{background:linear-gradient(90deg,#6fd6b5,#5ec8f2);border-radius:99px;height:100%}.mrow{color:#7f8fb8;justify-content:space-between;align-items:center;gap:10px;font-size:15px;display:flex}.mrow .btn{width:auto;box-shadow:0 4px 0 var(--yellowD);padding:8px 14px;font-size:15px}.mrow .btn.white{box-shadow:0 4px #c9dff0}#combo.pop{animation:.25s comboPop}@keyframes comboPop{50%{transform:scale(1.4)}}#storyCanvas{aspect-ratio:4/3;background:linear-gradient(#bfe6ff,#eaf8ff);border-radius:20px;width:100%;display:block}.storyText{word-break:keep-all;min-height:90px;margin:14px 4px 10px;font-size:20px;line-height:1.5}.storyText b{color:var(--pinkD);font-weight:400}.dots{justify-content:center;gap:6px;margin-bottom:12px;display:flex}.dots span{background:#d6e6f5;border-radius:50%;width:8px;height:8px}.dots span.on{background:var(--pink);border-radius:99px;width:20px}#toast{z-index:30;background:var(--ink);color:#fff;opacity:0;pointer-events:none;white-space:nowrap;border-radius:18px;padding:12px 22px;font-size:18px;transition:opacity .2s,transform .2s;position:fixed;top:40%;left:50%;transform:translate(-50%,-50%)scale(.9)}#toast.on{opacity:1;transform:translate(-50%,-50%)scale(1)}</style>

</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div class="pill">🐟 <span id="fishNow">0</span></div>
  <div id="scoreBox"><div id="score">0</div><div id="feverBar"><div id="feverFill"></div><span>🔥</span></div><div id="combo"></div></div>
  <button class="iconBtn" id="pauseBtn" aria-label="일시정지">⏸</button>
</div>
<div id="powers"></div>
<div id="banner"></div>

<div id="tutorial" class="hidden">
  <div class="hand">👆</div>
  <div class="msg">톡! 점프 · 한 번 더 톡! 2단 점프<br>👇 아래로 쓸면 배 미끄러지기</div>
</div>

<div id="start" class="screen">
  <div class="card">
    <div class="logo">펭귄 대탈출</div>
    <div class="sub">아기 공룡이 날 엄마인 줄 알아요! 🦖💕</div>
    <canvas id="hero" width="400" height="340"></canvas>
    <div class="best">최고 기록 <b id="bestTxt">0</b></div>
    <button class="btn pink" id="playBtn">▶ 시작!</button>
    <div class="gap"></div>
    <div class="row">
      <button class="btn mint sm" id="shopBtn">👕 꾸미기</button>
      <button class="btn white sm" id="storyBtn">📖 이야기</button>
      <button class="btn white sm" id="soundBtn" style="flex:.8">🔊</button>
    </div>
    <div class="gap s"></div>
    <button class="btn white sm" id="missionBtn" style="position:relative">📋 오늘의 미션<span class="dot" id="missionDot"></span></button>
    <div class="fishTotal">🐟 <span id="fishTotal">0</span></div>
    <div class="tiny">
      <button class="link" id="removeAdsBtn">🚫 광고 제거</button>
      <button class="link" id="restoreBtn">구매 복원</button>
    </div>
  </div>
</div>

<div id="pause" class="screen hidden">
  <div class="card">
    <div class="logo" style="font-size:40px">일시정지</div>
    <div class="gap"></div>
    <button class="btn pink" id="resumeBtn">▶ 계속하기</button>
    <div class="gap"></div>
    <button class="btn white sm" id="quitBtn">🏠 처음으로</button>
  </div>
</div>

<div id="over" class="screen hidden">
  <div class="card">
    <div class="overTitle" id="overTitle">앗! 꼭 안겨버렸다!</div>
    <div class="scoreBig" id="overScore">0</div>
    <div id="newBest">🏆 최고 기록!</div>
    <div class="earn">🐟 +<span id="earnTxt">0</span></div>
    <div class="overSub" id="overSub" style="font-size:15px;color:#7f8fb8;margin-bottom:10px"></div>
    <button class="btn pink" id="reviveBtn">▶ 광고 보고 이어하기</button>
    <div class="gap s"></div>
    <button class="btn white sm" id="doubleBtn">▶ 광고 보고 물고기 2배</button>
    <div class="gap"></div>
    <button class="btn" id="retryBtn">🔄 다시 하기</button>
    <div class="gap"></div>
    <div class="row">
      <button class="btn mint sm" id="overShopBtn">👕 꾸미기</button>
      <button class="btn white sm" id="homeBtn">🏠 처음</button>
    </div>
  </div>
</div>

<div id="shop" class="screen hidden">
  <div class="card">
    <div class="shopHead">
      <h2>꾸미기</h2>
      <div class="pill" style="box-shadow:none;background:#eef8ff">🐟 <span id="shopFish">0</span></div>
    </div>
    <div class="grid" id="skinGrid"></div>
    <div class="gap"></div>
    <button class="btn pink sm" id="freeFishBtn">▶ 광고 보고 🐟 +50</button>
    <div class="gap s"></div>
    <button class="btn white sm" id="shopClose">닫기</button>
  </div>
</div>

<div id="story" class="screen hidden">
  <div class="card">
    <canvas id="storyCanvas" width="400" height="300"></canvas>
    <p class="storyText" id="storyText"></p>
    <div class="dots" id="storyDots"></div>
    <button class="btn pink" id="storyNext">다음 ▶</button>
    <div class="tiny"><button class="link" id="storySkip">건너뛰기</button></div>
  </div>
</div>

<div id="missions" class="screen hidden">
  <div class="card">
    <div class="logo" style="font-size:36px">오늘의 미션</div>
    <div class="sub">매일 새 미션 3개! 다 하면 물고기 받아요</div>
    <div class="gap s"></div>
    <div id="missionList"></div>
    <div class="gap"></div>
    <button class="btn white sm" id="missionClose">닫기</button>
  </div>
</div>

<div id="toast"></div>

</body>
</html>
